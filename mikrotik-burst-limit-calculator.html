<!DOCTYPE html>
<html lang="en">
<head>
    <title>MikroTik Burst Limit Calculator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate MikroTik RouterOS burst limit values for simple queues easily and accurately.">
    <link rel="shortcut icon" href="https://mikrotikscript.github.io/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
            --bg-color: #12121c;
            --card-color: #1c1c2b;
            --primary-color: #8E2DE2;
            --secondary-color: #4A00E0;
            --text-color: #e0e0e0;
            --text-muted-color: #a0a0a0;
            --border-color: #333;
            --success-color: #28a745;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .header p { font-size: 1.1rem; color: var(--text-muted-color); }
        .header a { color: var(--primary-color); text-decoration: none; }
        .header a:hover { text-decoration: underline; }

        .calculator-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .form-container, .result-container {
            background-color: var(--card-color);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted-color);
        }
        
        .input-group {
            display: flex;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }
        
        .form-group input {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
            border-right: none;
        }
        
        .form-group select {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            width: auto;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(142, 45, 226, 0.2);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
        }
        .btn:hover { transform: translateY(-3px); }

        .result-output { position: relative; }
        
        #result-command {
            width: 100%;
            background-color: #0d0d15;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            color: #f8f8f2;
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            min-height: 80px;
        }
        
        #copy-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: var(--card-color);
            color: var(--text-muted-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10;
        }
        #copy-btn:hover { color: var(--text-color); }
        #copy-btn.copied { color: var(--success-color); }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted-color);
        }
        footer a { color: var(--primary-color); }

    </style>
</head>
<body>

    <main class="container">
        <header class="header">
             <h1><i class="fas fa-calculator"></i> MikroTik Burst Limit Calculator</h1>
            <p>Kalkulator sederhana untuk menghitung parameter burst pada Simple Queue.</p>
            <a href="https://mikrotikscript.github.io/tools/"><i class="fas fa-arrow-left"></i> Kembali ke Halaman Utama</a>
        </header>

        <div class="calculator-layout">
            <div class="form-container">
                <form onsubmit="calculateBurst(); return false;">
                    <div class="form-group">
                        <label for="max-limit"><i class="fas fa-arrow-down"></i> Max Limit (Upload/Download)</label>
                        <div class="input-group">
                            <input type="number" id="max-limit" value="1" required>
                            <select id="max-limit-unit">
                                <option value="M" selected>Mbps</option>
                                <option value="k">Kbps</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="burst-limit"><i class="fas fa-tachometer-alt"></i> Burst Limit</label>
                        <div class="input-group">
                            <input type="number" id="burst-limit" value="2" required>
                            <select id="burst-limit-unit">
                                <option value="M" selected>Mbps</option>
                                <option value="k">Kbps</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="burst-time"><i class="fas fa-clock"></i> Burst Time (detik)</label>
                        <input type="number" id="burst-time" value="8" style="border-radius: 8px;">
                    </div>

                    <button type="submit" class="btn btn-primary"><i class="fas fa-cogs"></i> Hitung & Generate</button>
                </form>
            </div>
            
            <div class="result-container">
                <h2><i class="fas fa-code"></i> Hasil Perintah Simple Queue</h2>
                <div class="result-output">
                    <button id="copy-btn" onclick="copyCommand()"><i class="fas fa-copy"></i> Salin</button>
                    <div id="result-command" placeholder="Perintah akan muncul di sini..."></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2020-2024 <a href="https://mikrotiktool.github.io">Free Mikrotik Routeros Tools</a>. Ditenagai oleh <a href="https://pages.github.com/">GitHub Pages</a>.</p>
    </footer>

    <script>
        function calculateBurst() {
            // Get values
            const maxLimitValue = parseFloat(document.getElementById('max-limit').value);
            const maxLimitUnit = document.getElementById('max-limit-unit').value;
            const burstLimitValue = parseFloat(document.getElementById('burst-limit').value);
            const burstLimitUnit = document.getElementById('burst-limit-unit').value;
            const burstTime = parseInt(document.getElementById('burst-time').value) || 0;

            // Convert to bps
            const maxLimitBps = maxLimitValue * (maxLimitUnit === 'M' ? 1000000 : 1000);
            const burstLimitBps = burstLimitValue * (burstLimitUnit === 'M' ? 1000000 : 1000);

            // Calculate Burst Threshold
            const burstThresholdBps = Math.round(0.75 * maxLimitBps);

            // Format for display
            const formatBps = (bps) => {
                if (bps >= 1000000) return (bps / 1000000) + 'M';
                if (bps >= 1000) return (bps / 1000) + 'k';
                return bps;
            };

            const maxLimitFormatted = `${maxLimitValue}${maxLimitUnit}`;
            const burstLimitFormatted = `${burstLimitValue}${burstLimitUnit}`;
            const burstThresholdFormatted = formatBps(burstThresholdBps);

            // Generate command
            const command = `/queue simple add name=queue-burst-test target=192.168.88.254 \\
    max-limit=${maxLimitFormatted}/${maxLimitFormatted} \\
    burst-limit=${burstLimitFormatted}/${burstLimitFormatted} \\
    burst-threshold=${burstThresholdFormatted}/${burstThresholdFormatted} \\
    burst-time=${burstTime}s/${burstTime}s`;

            // Display command
            document.getElementById('result-command').textContent = command;
        }

        function copyCommand() {
            const commandDiv = document.getElementById('result-command');
            const commandText = commandDiv.textContent;
            if (!commandText) return;

            navigator.clipboard.writeText(commandText).then(() => {
                const copyBtn = document.getElementById('copy-btn');
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Disalin!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Salin';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        }

        // Initial calculation on page load
        document.addEventListener('DOMContentLoaded', calculateBurst);
    </script>

</body>
</html>
