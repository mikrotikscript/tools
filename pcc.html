<!DOCTYPE html>
<html lang="en">
<head>
    <title>Load Balancing PCC Script Generator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate MikroTik RouterOS scripts for PCC (Per Connection Classifier) Load Balancing.">
    <link rel="shortcut icon" href="https://mikrotiktool.github.io/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-color: #12121c;
            --card-color: #1c1c2b;
            --primary-color: #8E2DE2;
            --secondary-color: #4A00E0;
            --text-color: #e0e0e0;
            --text-muted-color: #a0a0a0;
            --border-color: #333;
            --success-color: #28a745;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .header p { font-size: 1.1rem; color: var(--text-muted-color); }
        .header a { color: var(--primary-color); text-decoration: none; }
        .header a:hover { text-decoration: underline; }

        .generator-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr; /* Make script area a bit wider */
            gap: 2rem;
            align-items: flex-start;
        }

        .form-container, .script-container {
            background-color: var(--card-color);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted-color);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(142, 45, 226, 0.2);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
        }
        .btn:hover { transform: translateY(-3px); }

        .script-output { position: relative; }
        
        #script-result {
            width: 100%;
            height: 450px; /* Taller text area */
            background-color: #0d0d15;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            color: #f8f8f2;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        
        #copy-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
