<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikrotiktool.GitHub.io - VPN Game Script Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2e86de; /* Biru cerah */
            --secondary-color: #f1c40f; /* Kuning */
            --dark-text: #34495e; /* Teks gelap */
            --light-bg: #ecf0f1; /* Latar belakang terang */
            --white: #ffffff;
            --border-color: #cccccc;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            color: var(--dark-text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: var(--white);
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow-color);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        header {
            width: 100%;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2.2em;
            margin-bottom: 5px;
            font-weight: 700;
        }

        header p {
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .input-section, .output-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fdfdfd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .input-section h2, .output-section h2 {
            color: var(--primary-color);
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--dark-text);
        }

        input[type="text"],
        input[type="password"],
        select {
            width: calc(100% - 22px); /* Adjust for padding and border */
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(46, 134, 222, 0.2);
            outline: none;
        }

        textarea {
            width: calc(100% - 22px);
            height: 300px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            background-color: #2d3436;
            color: #fefefe;
            white-space: pre-wrap;
            word-wrap: break-word;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: block;
            width: 100%;
            margin-top: 20px;
            font-weight: 600;
        }

        button:hover {
            background-color: #256bbd;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .checkbox-group {
            margin-bottom: 15px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
            width: auto; /* Override full width for checkboxes */
        }

        .game-list-section {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .game-list-section label {
            margin-bottom: 10px;
        }

        .game-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px;
            background-color: var(--white);
        }

        .game-list div {
            padding: 5px 0;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .game-list div:hover {
            background-color: var(--light-bg);
        }

        .game-list div.selected {
            background-color: var(--primary-color);
            color: var(--white);
            border-radius: 3px;
        }
        
        .section-title {
            font-weight: 600;
            margin-top: 15px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        /* Responsiveness */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                margin: 10px;
                padding: 15px;
            }
            .input-section, .output-section {
                min-width: unset;
                width: 100%;
            }
            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mikrotiktool.GitHub.io</h1>
            <p>STATIC ROUTING VPN GAME SCRIPT GENERATOR { PORT GAME ROUTING METHOD }</p>
        </header>

        <div class="input-section">
            <h2>VPN Connection Settings</h2>
            <div class="form-group">
                <label for="vpnConnectionType">Select VPN Connection</label>
                <select id="vpnConnectionType">
                    <option value="pptp">PPTP - Point to Point Tunneling Protocol</option>
                    <option value="l2tp">L2TP - Layer 2 Tunneling Protocol</option>
                    <option value="ovpn">OVPN - OpenVPN</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vpnInterfaceName">Create VPN Name on Interface</label>
                <input type="text" id="vpnInterfaceName" value="VPN-GAME">
            </div>

            <div class="form-group">
                <label for="vpnIpAddress">VPN IP Address <small>(example: 137.129.63.112)</small></label>
                <input type="text" id="vpnIpAddress" placeholder="example: 137.129.63.112">
            </div>

            <div class="form-group">
                <label for="vpnUsername">VPN Username</label>
                <input type="text" id="vpnUsername" placeholder="username">
            </div>

            <div class="form-group">
                <label for="vpnPassword">VPN Password</label>
                <input type="password" id="vpnPassword" placeholder="password">
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="ispGatewayOptional"> IP Gateway ISP (optional) <small>(example: 192.168.2.1)</small>
                </label>
                <input type="text" id="ispGateway" placeholder="example: 192.168.2.1" disabled>
            </div>
            
            <div class="game-list-section">
                <label for="searchGame">Select Mangle Games</label>
                <input type="text" id="searchGame" placeholder="find Game...">
                <div class="game-list" id="gameList">
                    <div class="section-title">MOBILE GAMES</div>
                    <div data-game-ports="80,443,1935,3478-3480,50000-59000">Mobile Legends</div>
                    <div data-game-ports="80,443,1935,3478-3480,50000-59000">PUBG Mobile</div>
                    <div data-game-ports="80,443,1935,3478-3480,50000-59000">Free Fire</div>
                    <div data-game-ports="80,443,1935,3478-3480,50000-59000">Genshin Impact</div>
                    <div class="section-title">PC GAMES</div>
                    <div data-game-ports="27015-27030,27036-27037,4380,443,80,3074,3478-3479,5223,53,6881-6999,1935,3478,3479,5060,5062,6250,12000,27000-27050">CS:GO</div>
                    <div data-game-ports="80,443,1935,3478-3480,50000-59000">Valorant</div>
                    <div data-game-ports="80,443,1935,3478-3480,50000-59000">Dota 2</div>
                    <div data-game-ports="80,443,1935,3478-3480,50000-59000">League of Legends</div>
                    </div>
            </div>

            <button onclick="generateScript()">Generate Script</button>
        </div>

        <div class="output-section">
            <h2>Script Generator Results</h2>
            <textarea id="scriptOutput" readonly></textarea>
        </div>
    </div>

    <script>
        // --- EXISTING SCRIPT LOGIC (PASTED HERE) ---
        // Anda bisa menempatkan script yang ada di sini
        // Saya akan menambahkan sedikit modifikasi untuk integrasi dengan tampilan baru
        const vpnConnectionType = document.getElementById('vpnConnectionType');
        const vpnInterfaceName = document.getElementById('vpnInterfaceName');
        const vpnIpAddress = document.getElementById('vpnIpAddress');
        const vpnUsername = document.getElementById('vpnUsername');
        const vpnPassword = document.getElementById('vpnPassword');
        const ispGatewayOptional = document.getElementById('ispGatewayOptional');
        const ispGateway = document.getElementById('ispGateway');
        const searchGame = document.getElementById('searchGame');
        const gameList = document.getElementById('gameList');
        const scriptOutput = document.getElementById('scriptOutput');

        let selectedGamePorts = '';

        // Event listener for ISP Gateway checkbox
        ispGatewayOptional.addEventListener('change', function() {
            ispGateway.disabled = !this.checked;
            if (!this.checked) {
                ispGateway.value = '';
            }
        });

        // Game list filtering
        searchGame.addEventListener('keyup', function() {
            const filter = searchGame.value.toLowerCase();
            const games = gameList.getElementsByTagName('div');
            for (let i = 0; i < games.length; i++) {
                const gameDiv = games[i];
                if (gameDiv.classList.contains('section-title')) continue; // Skip titles
                const text = gameDiv.textContent || gameDiv.innerText;
                if (text.toLowerCase().indexOf(filter) > -1) {
                    gameDiv.style.display = '';
                } else {
                    gameDiv.style.display = 'none';
                }
            }
        });

        // Game selection
        gameList.addEventListener('click', function(event) {
            const target = event.target;
            if (target.tagName === 'DIV' && !target.classList.contains('section-title')) {
                // Remove existing selection
                const currentSelected = gameList.querySelector('.selected');
                if (currentSelected) {
                    currentSelected.classList.remove('selected');
                }
                // Add new selection
                target.classList.add('selected');
                selectedGamePorts = target.getAttribute('data-game-ports');
            }
        });

        function generateScript() {
            const type = vpnConnectionType.value;
            const ifName = vpnInterfaceName.value.trim();
            const ipAddr = vpnIpAddress.value.trim();
            const user = vpnUsername.value.trim();
            const pass = vpnPassword.value.trim();
            const gateway = ispGatewayOptional.checked ? ispGateway.value.trim() : '';

            if (!ifName || !ipAddr || !user || !pass || !selectedGamePorts) {
                alert('Please fill all required VPN settings and select a game!');
                return;
            }

            let script = `###
# VPN Game Script Generator By Mikrotiktool.GitHub.io
# Date: ${new Date().toLocaleString()}
# mikrotiktool.GitHub.io +
# VPN Type -> ${type.toUpperCase()}
###

`;

            // Interface creation
            if (type === 'pptp') {
                script += `/interface pptp-client
add connect-to="${ipAddr}" disabled=no name="${ifName}" user="${user}" password="${pass}" comment="${ifName}"`;
                if (gateway) {
                    script += ` gateway="${gateway}"`;
                }
                script += `\n`;
            } else if (type === 'l2tp') {
                script += `/interface l2tp-client
add connect-to="${ipAddr}" disabled=no name="${ifName}" user="${user}" password="${pass}" comment="${ifName}"`;
                if (gateway) {
                    script += ` gateway="${gateway}"`;
                }
                script += `\n`;
            } else if (type === 'ovpn') {
                script += `# Untuk OpenVPN, Anda perlu mengunduh file .ovpn dan mengimpornya secara manual atau membuat client secara manual di RouterOS.
# Pastikan Anda memiliki sertifikat dan kunci yang benar.
# Contoh konfigurasi dasar (mungkin memerlukan penyesuaian):
/interface ovpn-client
add connect-to="${ipAddr}" user="${user}" password="${pass}" name="${ifName}" comment="${ifName}"
# Pastikan Anda mengunggah sertifikat CA, client.crt, dan client.key ke MikroTik files.
# set "${ifName}" certificate="client_name" verify-server-certificate=yes \
#    mode=ethernet cipher=aes128 protocol=tcp port=1194 \
#    auth=sha1 auth-alg=sha1
\n`;
            }

            // NAT rule
            script += `/ip firewall nat
add chain=srcnat out-interface="${ifName}" action=masquerade comment="${ifName}"\n`;

            // IP Route
            script += `/ip route
add gateway="${ifName}" routing-mark="vpn-routing-game" comment="${ifName}"\n`;

            // Mangle rules
            script += `/ip firewall mangle
add action=mark-connection chain=prerouting comment="mark connection ${ifName}" disabled=no dst-port=${selectedGamePorts} new-connection-mark="${ifName}-conn" protocol=tcp
add action=mark-connection chain=prerouting comment="mark connection ${ifName}" disabled=no dst-port=${selectedGamePorts} new-connection-mark="${ifName}-conn" protocol=udp
add action=mark-routing chain=prerouting comment="mark routing ${ifName}" connection-mark="${ifName}-conn" disabled=no new-routing-mark="vpn-routing-game"`;

            scriptOutput.value = script;
        }

        // Initialize script output with example on load
        window.onload = generateScript;
    </script>
</body>
</html>
