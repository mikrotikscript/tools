<!DOCTYPE html>
<html lang="en">
<head>
    <title>Load Balancing ECMP Script Generator - MikroTik Tools</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate MikroTik RouterOS scripts for ECMP Load Balancing easily.">
    <link rel="shortcut icon" href="https://mikrotikscript.github.io/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
            --bg-color: #12121c;
            --card-color: #1c1c2b;
            --primary-color: #8E2DE2;
            --secondary-color: #4A00E0;
            --text-color: #e0e0e0;
            --text-muted-color: #a0a0a0;
            --border-color: #333;
            --success-color: #28a745;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .header p { font-size: 1.1rem; color: var(--text-muted-color); }
        .header a { color: var(--primary-color); text-decoration: none; }
        .header a:hover { text-decoration: underline; }

        .generator-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: flex-start;
        }

        .form-container, .script-container {
            background-color: var(--card-color);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted-color);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(142, 45, 226, 0.2);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
        }
        .btn:hover { transform: translateY(-3px); }

        .script-output {
            position: relative;
        }
        
        #script-result {
            width: 100%;
            height: 400px;
            background-color: #0d0d15;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            color: #f8f8f2;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        
        #copy-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: var(--card-color);
            color: var(--text-muted-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10;
        }
        #copy-btn:hover { color: var(--text-color); }
        #copy-btn.copied { color: var(--success-color); }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted-color);
        }
        footer a { color: var(--primary-color); }

        @media screen and (max-width: 992px) {
            .generator-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <main class="container">
        <header class="header">
             <h1><i class="fas fa-project-diagram"></i> ECMP Load Balancing Generator</h1>
            <p>Buat skrip Load Balancing ECMP (Equal Cost Multi Path) untuk MikroTik RouterOS.</p>
            <a href="https://mikrotikscript.github.io/tools/"><i class="fas fa-arrow-left"></i> Kembali ke Halaman Utama</a>
        </header>

        <div class="generator-layout">
            <div class="form-container">
                <form onsubmit="generateScript(); return false;">
                    <div class="form-group">
                        <label for="isp-count"><i class="fas fa-wifi"></i> Jumlah ISP</label>
                        <select id="isp-count" onchange="updateIspFields()">
                            <option value="2">2 ISP</option>
                            <option value="3">3 ISP</option>
                            <option value="4">4 ISP</option>
                            <option value="5">5 ISP</option>
                        </select>
                    </div>

                    <div id="isp-fields">
                        </div>

                    <div class="form-group">
                        <label for="lan-network"><i class="fas fa-network-wired"></i> Alamat Network LAN</label>
                        <input type="text" id="lan-network" value="192.168.88.0/24" required>
                    </div>

                    <button type="submit" class="btn btn-primary"><i class="fas fa-cogs"></i> Generate Script</button>
                </form>
            </div>
            
            <div class="script-container">
                <h2><i class="fas fa-code"></i> Hasil Script</h2>
                <div class="script-output">
                    <button id="copy-btn" onclick="copyScript()"><i class="fas fa-copy"></i> Salin</button>
                    <textarea id="script-result" readonly placeholder="Hasil skrip akan muncul di sini..."></textarea>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2020-2024 <a href="https://mikrotiktool.github.io">Free Mikrotik Routeros Tools</a>. Ditenagai oleh <a href="https://pages.github.com/">GitHub Pages</a>.</p>
    </footer>

    <script>
        function updateIspFields() {
            const count = document.getElementById('isp-count').value;
            const container = document.getElementById('isp-fields');
            let fieldsHtml = '';

            for (let i = 1; i <= count; i++) {
                fieldsHtml += `
                    <div class="form-group">
                        <label for="interface${i}">Interface ISP ${i}</label>
                        <input type="text" id="interface${i}" value="ether${i}" placeholder="e.g., ether1">
                    </div>
                    <div class="form-group">
                        <label for="gateway${i}">Gateway ISP ${i}</label>
                        <input type="text" id="gateway${i}" value="192.168.${i}.1" placeholder="e.g., 192.168.1.1">
                    </div>
                `;
            }
            container.innerHTML = fieldsHtml;
        }

        function generateScript() {
            const count = parseInt(document.getElementById('isp-count').value);
            const lan = document.getElementById('lan-network').value;
            let script = `# ECMP Load Balancing Script for ${count} ISPs\n# Generated by mikrotiktool.github.io\n\n`;

            // Mangle Rules
            script += "/ip firewall mangle\n";
            script += `add action=accept chain=prerouting disabled=no in-interface=bridge-local\n`;
            for (let i = 1; i <= count; i++) {
                const iface = document.getElementById(`interface${i}`).value;
                script += `add action=mark-connection chain=prerouting disabled=no in-interface=${iface} new-connection-mark=conn-isp${i} passthrough=yes\n`;
                script += `add action=mark-routing chain=prerouting connection-mark=conn-isp${i} disabled=no in-interface=bridge-local new-routing-mark=route-isp${i} passthrough=no\n`;
            }
             script += `add action=mark-routing chain=output connection-state=new disabled=no new-routing-mark=route-isp1 passthrough=no per-connection-classifier=both-addresses:${count}/0\n`;
             script += `add action=mark-routing chain=output connection-state=new disabled=no new-routing-mark=route-isp2 passthrough=no per-connection-classifier=both-addresses:${count}/1\n`;
             if (count >= 3) script += `add action=mark-routing chain=output connection-state=new disabled=no new-routing-mark=route-isp3 passthrough=no per-connection-classifier=both-addresses:${count}/2\n`;
             if (count >= 4) script += `add action=mark-routing chain=output connection-state=new disabled=no new-routing-mark=route-isp4 passthrough=no per-connection-classifier=both-addresses:${count}/3\n`;
             if (count >= 5) script += `add action=mark-routing chain=output connection-state=new disabled=no new-routing-mark=route-isp5 passthrough=no per-connection-classifier=both-addresses:${count}/4\n`;
            
            // Route Rules
            script += "\n/ip route\n";
            let gatewayList = [];
            for (let i = 1; i <= count; i++) {
                const gateway = document.getElementById(`gateway${i}`).value;
                gatewayList.push(gateway);
                script += `add check-gateway=ping disabled=no distance=1 gateway=${gateway} routing-mark=route-isp${i}\n`;
            }
            script += `add check-gateway=ping disabled=no distance=1 gateway=${gatewayList.join(',')} pref-src="" routing-mark=main scope=30 target-scope=10\n`

            document.getElementById('script-result').value = script;
        }

        function copyScript() {
            const textarea = document.getElementById('script-result');
            if (!textarea.value) return;

            textarea.select();
            document.execCommand('copy');
            
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Disalin!';
            copyBtn.classList.add('copied');
            
            setTimeout(() => {
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Salin';
                copyBtn.classList.remove('copied');
            }, 2000);
        }

        // Initial call to set up the form
        document.addEventListener('DOMContentLoaded', updateIspFields);
    </script>

</body>
</html>
